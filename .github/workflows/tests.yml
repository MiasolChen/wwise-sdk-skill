name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor is the version CONTRIBUTING.md and README.md promise;
        # the ceiling is the current release. Both ends are load-bearing.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.13"]
        include:
          # Intermediate versions add little on three operating systems, so
          # cover them on Linux only.
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check the helper runs without an SDK
        shell: bash
        run: |
          # The helper has no third-party dependencies, so importing and
          # printing help must work on a bare interpreter.
          python scripts/wwise_sdk.py --help

          # With no SDK configured, `locate` must fail cleanly with exit 1 and
          # a message naming the example config, not a traceback.
          set +e
          output=$(python scripts/wwise_sdk.py locate 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 1 ]; then
            echo "::error::expected exit 1 with no SDK configured, got $status"
            exit 1
          fi
          case "$output" in
            *Traceback*)
              echo "::error::locate raised instead of reporting"
              exit 1
              ;;
            *wwise-sdk.config.example.json*) ;;
            *)
              echo "::error::message should point at the example config"
              exit 1
              ;;
          esac
