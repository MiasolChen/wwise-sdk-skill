name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor is the version CONTRIBUTING.md and README.md promise;
        # the ceiling is the current release. Both ends are load-bearing.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.13"]
        include:
          # Intermediate versions add little on three operating systems, so
          # cover them on Linux only.
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check the helper runs as a script
        # The unit tests import the module directly, so they never prove the
        # file runs as a subprocess on a bare interpreter with no third-party
        # packages installed. CLI behaviour itself is covered by the tests.
        run: python scripts/wwise_sdk.py --help
